<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>universal-social-auth: vanilla TypeScript example</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <p>
        Signing in opens the provider in a popup. Your backend must exchange the
        returned code (see docs/recipes/express.md).
      </p>
      <button id="google-login" type="button">Sign in with Google</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
